{% extends "base.html" %}

{% block title %}Update Tenant - Tenant Management{% endblock %}

{% block content %}
<h2>✏️ Update Tenant Information</h2>

<form method="POST" action="/tenant/update/{{ tenant.id }}">
    <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" value="{{ tenant.name }}" required>
    </div>
    
    <div class="form-group">
        <label for="room_no">Room Number *</label>
        <input type="text" id="room_no" name="room_no" value="{{ tenant.room_no }}" required>
    </div>
    
    <div class="form-group">
        <label for="pg_old">Previous PG</label>
        <input type="text" id="pg_old" name="pg_old" value="{{ tenant.pg_old or '' }}">
    </div>
    
    <div class="form-group">
        <label for="pg_new">Current PG *</label>
        <input type="text" id="pg_new" name="pg_new" value="{{ tenant.pg_new }}" required>
    </div>
    
    <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" value="{{ tenant.email }}" required>
    </div>
    
    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ tenant.phone or '' }}">
    </div>
    
    <div style="margin-top: 30px;">
        <button type="submit" class="btn btn-success">💾 Update Tenant</button>
        <a href="/tenant/{{ tenant.id }}" class="btn">❌ Cancel</a>
    </div>
</form>
{% endblock %}
